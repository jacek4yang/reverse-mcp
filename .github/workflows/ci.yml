name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # NOTE: the repo vendors idalib/idalib-sys (optional, feature-gated);
      # their build scripts require the proprietary IDA SDK headers which are
      # NOT in the repo. Target our crates explicitly instead of --workspace.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p reverse-mcp -p rmcp-core -p rmcp-ida -p rmcp-worker -p rmcp-broker --all-targets -- -D warnings

      - name: Tests (mock backend, no IDA required)
        run: cargo test -p reverse-mcp -p rmcp-core -p rmcp-ida -p rmcp-worker -p rmcp-broker

      - name: Build release binaries (mock)
        run: cargo build --release -p reverse-mcp -p rmcp-worker

      # Public CI cannot run the real ABI probe (needs proprietary SDK
      # headers) but it CAN verify the checked-in expected-fact file stays
      # consistent with the Rust mirrors: backend facts are re-checked by
      # the rmcp-core unit tests above; the structural JSON check catches
      # hand-edits that drop facts.
      - name: ABI fact file structure
        shell: pwsh
        run: |
          $j = Get-Content backends/abi/expected-9_2.json -Raw | ConvertFrom-Json
          if (-not $j.sdk.version -eq '9.2') { throw "sdk.version must be 9.2" }
          foreach ($family in @('sizeof','alignof','offsetof')) {
            $n = ($j.probes.$family.PSObject.Properties | Measure-Object).Count
            if ($n -lt 1) { throw "probes.$family must not be empty" }
          }
          Write-Host "expected-9_2.json structure OK"

      - name: Distribution check (no proprietary material)
        shell: pwsh
        run: ./scripts/check-distribution.ps1
