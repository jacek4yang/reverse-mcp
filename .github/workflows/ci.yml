name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The IDA SDK is MIT-licensed and pinned as two git submodules.
      # Proprietary IDA runtime binaries are still never required by public CI.
      - name: Verify IDA SDK submodules
        shell: pwsh
        run: |
          $expected = @{
            'vendor/idalib-sys/sdk' = '7f8fd3100142295bffa5eabb2ce6f5b5ac163c6b'
            'vendor/idalib94-sys/sdk' = '2a9143f2f4abd7f54fe20d1e40fb68391d19c4cb'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (git -C $entry.Key rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $entry.Value) {
              throw "$($entry.Key) expected $($entry.Value), got $actual"
            }
            if (-not (Test-Path (Join-Path $entry.Key 'src/include/auto.hpp'))) {
              throw "$($entry.Key) is missing src/include/auto.hpp"
            }
          }

      - name: Encoding guard (UTF-8, no BOM, no mojibake)
        run: python -X utf8 scripts/check-encoding.py

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p reverse-mcp -p rmcp-core -p rmcp-ida -p rmcp-worker -p rmcp-broker --all-targets -- -D warnings

      - name: Tests (mock backend, no IDA required)
        run: cargo test -p reverse-mcp -p rmcp-core -p rmcp-ida -p rmcp-worker -p rmcp-broker

      # Mirror-variant check for the 9.4 backend: runs the same layout tests
      # with the ida94 cfunc_t mirror variant selected (mock only, no runtime).
      - name: Mirror tests (ida94 variant)
        run: cargo test -p reverse-ida-sys --features ida94

      # Compile both real native backends against the pinned public SDK headers.
      # cargo check runs their build scripts/bindgen without requiring IDA DLLs.
      - name: Check real IDA backends
        run: |
          cargo check -p reverse-mcp --features idalib92
          cargo check -p reverse-mcp --features idalib94

      - name: Build release binaries (mock)
        run: cargo build --release -p reverse-mcp -p rmcp-worker

      # ABI expected-fact files are re-checked by rmcp-core tests above; this
      # structural check also catches hand-edits that drop probe families.
      - name: ABI fact file structure
        shell: pwsh
        run: |
          foreach ($f in @('expected-9_2.json', 'expected-9_4.json')) {
            $v = if ($f -eq 'expected-9_2.json') { '9.2' } else { '9.4' }
            $j = Get-Content "backends/abi/$f" -Raw | ConvertFrom-Json
            if (-not $j.sdk.version -eq $v) { throw "$f sdk.version must be $v" }
            foreach ($family in @('sizeof','alignof','offsetof')) {
              $n = ($j.probes.$family.PSObject.Properties | Measure-Object).Count
              if ($n -lt 1) { throw "$f probes.$family must not be empty" }
            }
            Write-Host "$f structure OK"
          }

      - name: Distribution check (no proprietary IDA runtime material)
        shell: pwsh
        run: ./scripts/check-distribution.ps1

  # Issue #48: Linux platform adapter build + mock suite. Allowed to fail
  # until a real Linux IDA install is available for the gated real-IDA
  # acceptance suite; flips to required then (tested-facts policy).
  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p reverse-mcp -p rmcp-core -p rmcp-ida -p rmcp-worker -p rmcp-broker --all-targets -- -D warnings

      - name: Tests (mock backend, no IDA required)
        run: cargo test -p reverse-mcp -p rmcp-core -p rmcp-ida -p rmcp-worker -p rmcp-broker

      - name: Platform adapter unit tests (per-OS expectations)
        run: cargo test -p rmcp-core platform
        continue-on-error: true
