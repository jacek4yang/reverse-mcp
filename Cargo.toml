[workspace]
resolver = "3"
members = [
    ".",
    "crates/reverse-ida-sys",
    "crates/rmcp-core",
    "crates/rmcp-ida",
    "crates/rmcp-worker",
    "crates/rmcp-broker",
    "crates/rmcp-wasm",
]

exclude = ["vendor/*"]

[package]
name = "reverse-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reverse-mcp"
path = "src/main.rs"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jacek4yang/reverse-mcp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Real IDA backends via vendored idalib (build-time SDK linkage). The IDA DLLs
# are delay-loaded so the exe starts without IDA on PATH (see build.rs).
# Exactly ONE native ABI may be selected per build: the vendored 9.2 and 9.4
# idalib trees mirror different SDK layouts and must never be linked together
# (build.rs enforces this at compile time).
# `idalib` is the v1.0 name and remains an alias for the 9.2 backend.
idalib = ["idalib92"]
idalib92 = ["rmcp-worker/idalib92", "dep:idalib", "dep:idalib-build"]
idalib94 = ["rmcp-worker/idalib94", "dep:idalib94", "dep:idalib94-build"]

[build-dependencies]
idalib-build = { path = "vendor/idalib-build", optional = true }
idalib94-build = { path = "vendor/idalib94-build", optional = true }

[dependencies]
rmcp-broker = { version = "1.0.0", path = "crates/rmcp-broker" }
rmcp-core = { path = "crates/rmcp-core" }
rmcp-worker = { path = "crates/rmcp-worker" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
rmcp = { version = "3.3.0", features = ["client", "transport-io"] }
sha2 = "0.10"
wat = "1.259.0"

[dependencies.idalib]
path = "vendor/idalib"
optional = true

[dependencies.idalib94]
path = "vendor/idalib94"
optional = true

[profile.release]
lto = "thin"
strip = true
