[workspace]
resolver = "3"
members = [
    ".",
    "crates/reverse-ida-sys",
    "crates/rmcp-core",
    "crates/rmcp-ida",
    "crates/rmcp-worker",
    "crates/rmcp-broker",
    "crates/rmcp-wasm",
]

exclude = ["vendor/*"]

[package]
name = "reverse-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reverse-mcp"
path = "src/main.rs"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jacek4yang/reverse-mcp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Real IDA backend via vendored idalib (build-time SDK linkage). The IDA DLLs
# are delay-loaded so the exe starts without IDA on PATH (see build.rs).
idalib = ["rmcp-worker/idalib", "dep:idalib", "dep:idalib-build"]

[build-dependencies]
idalib-build = { path = "vendor/idalib-build", optional = true }

[dependencies]
rmcp-broker = { version = "1.0.0", path = "crates/rmcp-broker" }
rmcp-core = { path = "crates/rmcp-core" }
rmcp-worker = { path = "crates/rmcp-worker" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
rmcp = { version = "3.3.0", features = ["client", "transport-io"] }
sha2 = "0.10"
wat = "1.259.0"

[dependencies.idalib]
path = "vendor/idalib"
optional = true

[profile.release]
lto = "thin"
strip = true
