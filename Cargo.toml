[workspace]
resolver = "3"
members = [
    ".",
    "crates/rmcp-core",
    "crates/rmcp-ida",
    "crates/rmcp-worker",
    "crates/rmcp-broker",
]

[package]
name = "reverse-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reverse-mcp"
path = "src/main.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jacek4yang/reverse-mcp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

[dependencies]
rmcp-core = { path = "crates/rmcp-core" }

[profile.release]
lto = "thin"
strip = true
