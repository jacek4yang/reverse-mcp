[package]
name = "rmcp-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp-core = { path = "../rmcp-core" }
rmcp-ida = { path = "../rmcp-ida" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[dependencies.idalib]
path = "../../vendor/idalib"
optional = true

[features]
idalib = ["rmcp-ida/idalib", "dep:idalib"]
default = []
