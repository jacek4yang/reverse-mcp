[package]
name = "rmcp-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp-core = { path = "../rmcp-core" }
rmcp-ida = { path = "../rmcp-ida" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[dependencies.idalib]
path = "../../vendor/idalib"
optional = true

[dependencies.idalib94]
path = "../../vendor/idalib94"
optional = true

[features]
default = []
# Exactly one native IDA ABI per build (enforced by compile_error! in lib.rs).
idalib92 = ["rmcp-ida/idalib92", "dep:idalib"]
idalib94 = ["rmcp-ida/idalib94", "dep:idalib94"]
# v1.0 name; alias for the 9.2 backend.
idalib = ["idalib92"]
