[package]
name = "rmcp-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp = { version = "3.3.0", features = ["server", "transport-io", "transport-child-process", "transport-streamable-http-server", "client"] }
rmcp-core = { path = "../rmcp-core", features = ["tokio-async"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rmcp-broker = { path = ".", version = "0.1.0" }

[features]
default = []
idalib = ["rmcp-ida/idalib", "dep:rmcp-ida"]

[dependencies.rmcp-ida]
path = "../rmcp-ida"
optional = true
