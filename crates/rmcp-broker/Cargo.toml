[package]
name = "rmcp-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp = { version = "3.3.0", features = ["server", "transport-io", "transport-child-process", "transport-streamable-http-server", "client"] }
rmcp-core = { path = "../rmcp-core", features = ["tokio-async"] }
rmcp-wasm = { path = "../rmcp-wasm" }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
tower = { version = "0.5", features = ["util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rmcp-broker = { path = ".", version = "1.0.0" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"

[features]
default = []
# The broker never links IDA itself; these exist so standalone broker builds
# can embed a real backend. `idalib` is the v1.0 name (9.2 alias).
idalib92 = ["rmcp-ida/idalib92", "dep:rmcp-ida"]
idalib94 = ["rmcp-ida/idalib94", "dep:rmcp-ida"]
idalib = ["idalib92"]

[dependencies.rmcp-ida]
path = "../rmcp-ida"
optional = true
